name: Daily pipeline

# 9:45 a.m. in New York. GitHub cron runs in UTC, so both entries are listed: 13:45 UTC is 9:45 EDT
# (March to November) and 14:45 UTC is 9:45 EST (November to March). The run is idempotent, so the
# second run of the day is a harmless refresh (it also picks up later injury news).
on:
  schedule:
    - cron: "45 13 * * *"
    - cron: "45 14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Tonight's date (YYYY-MM-DD). Empty means today in New York."
        required: false
        default: ""

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check for the database secret
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL is not set in this repository's Actions secrets, so the daily run was skipped. See docs/DEPLOY.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install the pipeline
        if: steps.check.outputs.skip != 'true'
        run: python -m pip install -e pipeline

      - name: Apply migrations
        if: steps.check.outputs.skip != 'true'
        run: python -m nba_pipeline migrate

      - name: Run the pipeline
        if: steps.check.outputs.skip != 'true'
        id: run
        run: |
          set -o pipefail
          DAY="${{ github.event.inputs.date }}"
          if [ -z "$DAY" ]; then DAY="$(TZ=America/New_York date +%F)"; fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          python -m nba_pipeline run --date "$DAY" | tee run.json

      - name: Write the digest and dashboard files
        if: steps.check.outputs.skip != 'true' && always() && steps.run.outcome != 'skipped'
        run: |
          DAY="${{ steps.run.outputs.day }}"
          python -m nba_pipeline digest --date "$DAY" --out digest.txt > /dev/null || true
          python -m nba_pipeline export-json --date "$DAY" --out "exports/$DAY" || true
          {
            echo "## NBA Daily run for $DAY"
            echo '```'
            cat run.json 2>/dev/null || true
            echo '```'
            echo '<details><summary>Digest</summary>'
            echo
            echo '```'
            cat digest.txt 2>/dev/null || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the dashboard JSON for 14 days
        if: steps.check.outputs.skip != 'true' && always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: nba-daily-${{ steps.run.outputs.day }}
          path: |
            exports/
            digest.txt
            run.json
          retention-days: 14
          if-no-files-found: ignore
