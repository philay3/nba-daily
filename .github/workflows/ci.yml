name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline tests (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nba_daily
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # the tests create and drop their own throwaway databases next to this one
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nba_daily
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install the pipeline
        run: python -m pip install -e "pipeline[dev]"
      - name: Run pytest
        working-directory: pipeline
        run: python -m pytest -q

  web:
    name: Web typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (pages render per request, so no database is needed here)
        run: npm run build

  smoke:
    name: Smoke test (seeded database, production build, Playwright)
    runs-on: ubuntu-latest
    needs: [pipeline, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nba_daily
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nba_daily
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Seed the fixture day
        run: |
          python -m pip install -e "pipeline[dev]"
          python -m nba_pipeline seed
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: Start the app and run the smoke test
        working-directory: web
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          # pin the seeded day so the result does not depend on today's date
          DATE=2026-11-02 GAME_ID=401909906 NODE_PATH="$(npm root -g)" npm run smoke
