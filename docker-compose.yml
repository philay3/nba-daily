# Local Postgres for development: `docker compose up -d db`
# Connection string: postgresql://nba:nba@localhost:5432/nba_daily (see .env.example)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nba_daily
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba -d nba_daily"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
